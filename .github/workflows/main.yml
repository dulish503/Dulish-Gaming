name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Package & Capacitor Config Files
        run: |
          cat << 'EOF' > package.json
          {
            "name": "dulish-gaming",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/core": "^6.0.0"
            }
          }
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.dulish.app",
            "appName": "Dulish Gaming",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Copy Real Web Files to WWW
        run: |
          mkdir -p www_temp
          rsync -av --exclude='.git' --exclude='.github' --exclude='node_modules' ./ www_temp/ || true
          
          # Find where index.html is located
          INDEX_PATH=$(find www_temp -name "index.html" | head -n 1)
          if [ -n "$INDEX_PATH" ]; then
            TARGET_DIR=$(dirname "$INDEX_PATH")
            cp -r "$TARGET_DIR"/* www/
          else
            cp -r www_temp/* www/
          fi
          rm -rf www_temp

      - name: Install Dependencies and Sync Capacitor
        run: |
          npm install --legacy-peer-deps
          npx cap add android || true
          npx cap copy android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
