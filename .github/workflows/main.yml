name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Package JSON & Config
        run: |
          cat << 'EOF' > package.json
          {
            "name": "dulish-gaming",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/core": "^6.0.0"
            }
          }
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.dulish.app",
            "appName": "Dulish Gaming",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Setup Web Directory
        run: |
          mkdir -p www
          find . -maxdepth 2 -not -path '*/.*' -not -name 'package*.json' -not -name 'capacitor.config.json' -not -name 'www' -exec cp -r {} www/ \; 2>/dev/null || true

      - name: Install & Sync Capacitor
        run: |
          npm install --legacy-peer-deps
          npx cap add android || true
          npx cap copy android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
