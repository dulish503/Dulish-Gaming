name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Force Create Package & Config Files
        run: |
          cat << 'EOF' > package.json
          {
            "name": "dulish-gaming",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/core": "^6.0.0"
            }
          }
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.dulish.app",
            "appName": "Dulish Gaming",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          cp -r *.html *.js *.css public/ assets/ dist/* www/ 2>/dev/null || true
          if [ ! -f www/index.html ]; then
            echo "<html><body><h1>Dulish Gaming App</h1></body></html>" > www/index.html
          fi

      - name: Install Capacitor & Add Android
        run: |
          npm install --legacy-peer-deps
          npx cap add android || true
          npx cap sync android || true

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
