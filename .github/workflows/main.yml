name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android Project
        run: |
          mkdir -p android_app/app/src/main/assets
          mkdir -p android_app/app/src/main/java/com/dulish/app
          mkdir -p android_app/gradle/wrapper

          # Copy Web Content
          cp -r *.html *.js *.css public/ assets/ dist/* android_app/app/src/main/assets/ 2>/dev/null || true
          if [ ! -f android_app/app/src/main/assets/index.html ]; then
            echo "<html><head><meta name='viewport' content='width=device-width, initial-scale=1.0'></head><body style='background:#000;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;'><h1>Dulish Gaming Loading...</h1></body></html>" > android_app/app/src/main/assets/index.html
          fi

          # Root build.gradle
          cat << 'EOF' > android_app/build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          # settings.gradle
          echo "include ':app'" > android_app/settings.gradle

          # App build.gradle
          cat << 'EOF' > android_app/app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.dulish.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.dulish.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > android_app/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="Dulish Gaming"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MainActivity.java
          cat << 'EOF' > android_app/app/src/main/java/com/dulish.app/MainActivity.java
          package com.dulish.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          cd android_app
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
