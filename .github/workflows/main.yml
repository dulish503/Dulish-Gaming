name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Package & Capacitor Config Files
        run: |
          cat << 'EOF' > package.json
          {
            "name": "dulish-gaming",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/core": "^6.0.0"
            }
          }
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.dulish.app",
            "appName": "Dulish Gaming",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Setup Web Directory
        run: |
          mkdir -p www
          find . -maxdepth 1 -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" \) -exec cp {} www/ \; 2>/dev/null || true
          [ -d "public" ] && cp -r public/* www/ 2>/dev/null || true
          [ -d "assets" ] && cp -r assets/ www/ 2>/dev/null || true
          [ -d "dist" ] && cp -r dist/* www/ 2>/dev/null || true
          if [ ! -f www/index.html ]; then
            echo "<html><head><meta name='viewport' content='width=device-width, initial-scale=1.0'></head><body style='background:#111;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;'><h1>Dulish Gaming Loaded Successfully!</h1></body></html>" > www/index.html
          fi

      - name: Install Dependencies and Sync Capacitor
        run: |
          npm install --legacy-peer-deps
          npx cap add android || true
          npx cap copy android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
